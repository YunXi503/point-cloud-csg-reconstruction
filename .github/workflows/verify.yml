name: Verify research reproduction
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-reproduction:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify packaged files
        run: node tools/verify-package.mjs
      - name: Install pinned environment
        run: python -m pip install -r requirements.lock.txt
      - name: Test failure guards
        run: python -m unittest discover -s tests -v
      - name: Reproduce the four inference examples
        run: python tools/verify-reproduction.py --case all --output-dir runs/ci-inference
      - name: Reproduce point normals through C Sharp and Python
        run: python tools/run-from-point-cloud.py --case all --output-dir runs/ci-point-cloud
      - name: Keep validation reports and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reproduction-reports
          path: |
            runs/**/reproduction-results.json
            runs/**/pipeline-results.json
            runs/**/*.log
          if-no-files-found: ignore
